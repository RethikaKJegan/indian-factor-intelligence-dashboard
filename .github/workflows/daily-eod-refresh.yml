name: Daily EOD Refresh
run-name: Daily EOD Refresh - ${{ github.event_name }}

on:
  workflow_dispatch:
  repository_dispatch:
    types: [daily-eod-refresh]
  schedule:
    # GitHub cron uses UTC. Run repeatedly during the India EOD window
    # because scheduled workflows can be delayed or occasionally dropped.
    # 18:00, 18:10, 18:20 IST.
    - cron: "30,40,50 12 * * 1-5"
    # 18:30, 18:40, 18:50, 19:00, 19:10, 19:20 IST.
    - cron: "0,10,20,30,40,50 13 * * 1-5"
    # 19:30, 19:40, 19:50, 20:00 IST.
    - cron: "0,10,20,30 14 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-eod-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Show trigger context
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "repository_dispatch_action=${{ github.event.action }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
          date -u

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run EOD refresh
        run: python scripts/daily_eod_refresh.py --allow-no-data

      - name: Run LangGraph pipeline
        run: python scripts/run_langgraph_pipeline.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Show refresh status
        run: cat public/data/eod_refresh_status.json

      - name: Commit updated data snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data data_input/processed_financial_data.sqlite
          if git diff --cached --quiet; then
            echo "No EOD data changes to commit."
          else
            git commit -m "Update daily EOD data snapshot"
            git push
          fi
